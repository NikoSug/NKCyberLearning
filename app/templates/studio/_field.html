<div class="studio-field{% if field.errors %} has-error{% endif %}{% if field.field.widget.input_type == 'checkbox' or field.field.widget.allow_multiple_selected %} wide{% endif %}">
  <label for="{{ field.id_for_label }}">{{ field.label }}{% if field.field.required %} <span class="required" aria-hidden="true">*</span>{% endif %}</label>
  {% if field.field.widget.allow_multiple_selected and field.field.widget.input_type == "checkbox" %}
    <div class="check-list">{% for box in field %}<label class="check-item">{{ box.tag }} {{ box.choice_label }}</label>{% endfor %}</div>
  {% else %}{{ field }}{% endif %}
  {% if field.help_text %}<p class="muted small">{{ field.help_text }}</p>{% endif %}
  {% for error in field.errors %}<p class="error small">{{ error }}</p>{% endfor %}
</div>
