{% comment %}Avatar d'un utilisateur. Paramètres : avatar (Avatar ou None), name (pseudo), size (sm, md, lg, xl), frame (cadre équipé ou None).{% endcomment %}
{% if frame %}<span class="avatar-frame {{ frame.css }}">{% endif %}{% if avatar %}<span class="avatar avatar-{{ size|default:'md' }} avatar-bg-{{ avatar.background }}" role="img" aria-label="Avatar {{ avatar.name }}">{{ avatar.emoji }}</span>{% else %}<span class="avatar avatar-{{ size|default:'md' }} avatar-initial" role="img" aria-label="Avatar de {{ name }}">{{ name|first|upper }}</span>{% endif %}{% if frame %}</span>{% endif %}
